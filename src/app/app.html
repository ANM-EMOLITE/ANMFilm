@if (!isAdmin()) {
  <header class="header" [class.scrolled]="scrolled()">
    <div class="container bar">
      <a class="brand" routerLink="/" aria-label="Trang chủ">
        <span class="logo"><ui-icon name="play" [size]="16" /></span>
        <span class="brand-text">Anime<b>Stream</b></span>
      </a>

      <nav class="nav">
        <a routerLink="/" [queryParams]="{ tab: 'trending' }" routerLinkActive="active">Thịnh hành</a>
        <a routerLink="/" [queryParams]="{ tab: 'season' }" routerLinkActive="active">Theo mùa</a>
        <a routerLink="/" [queryParams]="{ tab: 'movie' }" routerLinkActive="active">Phim lẻ</a>
      </nav>

      <app-search-box class="search" />

      @if (auth.isLoggedIn()) {
        <a class="account" routerLink="/account" title="Tài khoản của tôi">
          <ui-icon name="user" [size]="16" />
          <span class="account-name">{{ accountName() }}</span>
        </a>
      } @else {
        <a class="account login" routerLink="/login">
          <ui-icon name="user" [size]="16" />
          <span class="account-name">Đăng nhập</span>
        </a>
      }
    </div>
  </header>
}

<main>
  <router-outlet />
</main>

@if (!isAdmin()) {
  <footer class="footer">
    <div class="container">
      <span class="brand-text">Anime<b>Stream</b></span>
      <span class="text-muted">Phím tắt <kbd>/</kbd> để tìm kiếm</span>
    </div>
  </footer>
}

<ui-toaster />
